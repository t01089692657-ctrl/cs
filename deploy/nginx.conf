# ============ nginx 反向代理 + HTTPS（生产可选但推荐） ============
# 放到服务器 /etc/nginx/conf.d/waimao.conf，把 your-domain.com 换成你的域名。
# 证书用 certbot 免费签发：certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name your-domain.com;
    # certbot 会自动加 HTTPS 跳转；未装证书前可直接反代
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;   # 允许上传产品图/视频
    }
}
